<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agreemetrix AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              'real-white': '#ffffff',
              'real-black': '#000000',
              brand: {
                50: 'rgba(var(--color-brand-500), 0.05)',
                100: 'rgba(var(--color-brand-500), 0.1)',
                400: 'rgba(var(--color-brand-400), 1)',
                500: 'rgba(var(--color-brand-500), 1)', 
                600: 'rgba(var(--color-brand-600), 1)',
                700: 'rgba(var(--color-brand-700), 1)',
                900: 'rgba(var(--color-brand-900), 1)',
              },
              dark: {
                950: 'var(--bg-950)', // Main background
                900: 'var(--bg-900)', // Card background
                800: 'var(--bg-800)', // Lighter card
                700: 'var(--border-700)', // Borders
              },
              // Remap standard colors to variables for theme switching
              white: 'var(--text-main)',
              slate: {
                50: 'var(--slate-50)',
                100: 'var(--slate-100)',
                200: 'var(--slate-200)', // Primary Text (inverted in light mode)
                300: 'var(--slate-300)',
                400: 'var(--slate-400)', // Muted Text
                500: 'var(--slate-500)',
                600: 'var(--slate-600)',
                700: 'var(--slate-700)',
                800: 'var(--slate-800)',
                900: 'var(--slate-900)',
              },
              accent: {
                cyan: '#06b6d4',
                purple: '#8b5cf6',
                pink: '#ec4899',
                blue: '#3b82f6',
              }
            },
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            animation: {
              'blob': 'blob 10s infinite',
              'float': 'float 6s ease-in-out infinite',
              'shimmer': 'shimmer 2s linear infinite',
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'logo-pulse': 'logo-pulse 3s ease-in-out infinite',
              'text-scan': 'text-scan 4s linear infinite',
              'neural-pulse': 'neural-pulse 6s ease-in-out infinite',
              'scan-line': 'scan-line 8s linear infinite',
              'radar-spin': 'spin 20s linear infinite',
              'feed-pulse': 'feed-pulse 2s cubic-bezier(0.4, 0, 0.6, 1)',
              'grid-scan': 'grid-scan 20s linear infinite',
              'breathe': 'breathe 8s ease-in-out infinite',
              'chart-grow': 'chart-grow 0.8s ease-out forwards',
              'line-draw': 'line-draw 2s ease-out forwards',
            },
            keyframes: {
              blob: {
                '0%': { transform: 'translate(0px, 0px) scale(1)' },
                '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                '100%': { transform: 'translate(0px, 0px) scale(1)' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' },
              },
              shimmer: {
                '0%': { backgroundPosition: '200% 0' },
                '100%': { backgroundPosition: '-200% 0' }
              },
              'logo-pulse': {
                '0%, 100%': { boxShadow: '0 0 15px rgba(var(--color-brand-500), 0.2)' },
                '50%': { boxShadow: '0 0 25px rgba(var(--color-brand-500), 0.6)' }
              },
              'text-scan': {
                '0%, 100%': { backgroundPosition: '-200% 0' },
                '50%': { backgroundPosition: '200% 0' }
              },
              'neural-pulse': {
                '0%, 100%': { filter: 'drop-shadow(0 0 0px rgba(45, 212, 191, 0))', stroke: '#2dd4bf' },
                '50%': { filter: 'drop-shadow(0 0 8px rgba(45, 212, 191, 0.6))', stroke: '#5eead4' },
              },
              'scan-line': {
                '0%': { left: '-100%', opacity: '0' },
                '10%': { opacity: '0.5' }, 
                '40%': { left: '200%', opacity: '0' }, 
                '100%': { left: '200%', opacity: '0' },
              },
              'feed-pulse': {
                '0%': { boxShadow: '0 0 0 0 rgba(34, 197, 94, 0.7)' },
                '70%': { boxShadow: '0 0 0 10px rgba(34, 197, 94, 0)' },
                '100%': { boxShadow: '0 0 0 0 rgba(34, 197, 94, 0)' },
              },
              'grid-scan': {
                '0%': { backgroundPosition: '0% 0%' },
                '100%': { backgroundPosition: '50px 50px' },
              },
              'breathe': {
                '0%, 100%': { opacity: '0.1' },
                '50%': { opacity: '0.25' }, 
              },
              'chart-grow': {
                '0%': { height: '0%' },
                '100%': { height: '100%' }
              }
            }
          }
        }
      }
    </script>
    <style>
      :root {
        /* Default Dark Theme (Slate/Teal) */
        --bg-950: #020617;
        --bg-900: #0f172a;
        --bg-800: #1e293b;
        --border-700: #334155;
        
        --color-brand-400: 45, 212, 191;   /* #2dd4bf */
        --color-brand-500: 20, 184, 166;   /* #14b8a6 */
        --color-brand-600: 13, 148, 136;   /* #0d9488 */
        --color-brand-700: 15, 118, 110;
        --color-brand-900: 19, 78, 74;

        --text-main: #ffffff;
        --slate-50: #f8fafc;
        --slate-100: #f1f5f9;
        --slate-200: #e2e8f0; /* Lightest gray text for dark mode */
        --slate-300: #cbd5e1;
        --slate-400: #94a3b8;
        --slate-500: #64748b;
        --slate-600: #475569;
        --slate-700: #334155;
        --slate-800: #1e293b;
        --slate-900: #0f172a;
        
        --bg-gradient-from: #1e293b;
        --bg-gradient-to: #020617;
      }

      /* Light Mode - INVERTED TEXT COLORS */
      .theme-light {
        --bg-950: #f8fafc; /* Background */
        --bg-900: #ffffff; /* Cards */
        --bg-800: #f1f5f9; /* Elements */
        --border-700: #cbd5e1;

        --color-brand-400: 13, 148, 136; /* Darker teal for visibility on white */
        --color-brand-500: 15, 118, 110;
        --color-brand-600: 17, 94, 89;

        --text-main: #0f172a; /* Black text */
        
        /* Invert the slates so 'slate-200' (primary text) becomes dark */
        --slate-50: #020617;
        --slate-100: #0f172a;
        --slate-200: #1e293b; /* Dark text */
        --slate-300: #334155; /* Medium dark text */
        --slate-400: #475569; /* Muted text */
        --slate-500: #64748b;
        --slate-600: #94a3b8;
        --slate-700: #cbd5e1;
        --slate-800: #e2e8f0;
        --slate-900: #f1f5f9;
        
        --bg-gradient-from: #f1f5f9;
        --bg-gradient-to: #ffffff;
      }

      body { 
        font-family: 'Inter', system-ui, sans-serif; 
        background-color: var(--bg-950);
        background-image: radial-gradient(at 50% 0%, var(--bg-gradient-from) 0%, var(--bg-gradient-to) 70%);
        background-attachment: fixed;
        color: var(--slate-200);
        min-height: 100vh;
        transition: background-color 0.5s ease, color 0.5s ease;
      }
      
      /* Custom scrollbar for themes */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
      ::-webkit-scrollbar-thumb { background: var(--border-700); border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: var(--slate-500); }

      .glass-panel { 
        background: rgba(var(--bg-900), 0.6); 
        backdrop-filter: blur(16px); 
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--border-700);
      }
      
      .neon-glow {
        box-shadow: 0 0 15px rgba(var(--color-brand-500), 0.4);
      }
      
      .dot-grid-bg {
        background-image: radial-gradient(var(--border-700) 1px, transparent 1px);
        background-size: 20px 20px;
        opacity: 0.3;
      }
      
      .logo-scan-text {
        background: linear-gradient(to right, #fff 20%, var(--color-brand-400) 40%, #fff 60%);
        background-size: 200% auto;
        color: #fff;
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: text-scan 4s linear infinite;
      }

      .animation-delay-2000 { animation-delay: 2s; }
      .animation-delay-4000 { animation-delay: 4s; }
      
      /* Fix for SVGs to inherit text color */
      .text-white { color: var(--text-main); }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.9.6",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "recharts": "https://aistudiocdn.com/recharts@^3.4.1"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
